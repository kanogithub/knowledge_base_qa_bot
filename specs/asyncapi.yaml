asyncapi: "3.0.0"
info:
  title: Cloud-KB — Async Event & Message Contracts
  version: "1.0.0"
  description: |
    AsyncAPI specification for the Cloud-KB system's asynchronous messaging
    layer. Covers RabbitMQ task queues (write pipeline) and Redis Pub/Sub
    notification channels (cross-service eventing).

    ## SDD Automation Targets
    - **Index Worker:** AsyncAPI generators produce RabbitMQ consumer stubs
      with strongly-typed message classes, guaranteeing field-level
      compliance with this contract.
    - **Notification Service:** Redis Pub/Sub subscriber handlers are
      generated with typed event payloads.

# ─────────────────────────────────────────────────────────
# Servers — Broker Connections
# ─────────────────────────────────────────────────────────
servers:
  rabbitmq-dev:
    host: "localhost:5672"
    protocol: amqp
    description: Local RabbitMQ broker (Aspire-managed container)
    tags:
      - name: env:development

  redis-dev:
    host: "localhost:6379"
    protocol: redis
    description: Local Redis cluster (Aspire-managed container)
    tags:
      - name: env:development

  rabbitmq-prod:
    host: "rabbitmq.cloudkb.internal:5672"
    protocol: amqp
    description: Production RabbitMQ cluster
    tags:
      - name: env:production

  redis-prod:
    host: "redis.cloudkb.internal:6379"
    protocol: redis
    description: Production Redis cluster
    tags:
      - name: env:production

# ─────────────────────────────────────────────────────────
# Channels — Message Destinations
# ─────────────────────────────────────────────────────────
channels:

  # ── RabbitMQ: Knowledge Compilation Task Queue ─────────
  knowledgeCompileQueue:
    address: "cloudkb.indexing.compile"
    description: |
      RabbitMQ durable queue for knowledge compilation tasks. The Indexing
      API publishes a `CompileKnowledgeTask` message after streaming
      uploaded files to S3. The Index Worker consumes from this queue.

      **Exchange:** `cloudkb.indexing` (topic exchange)
      **Routing Key:** `compile.{tenantId}`
      **Queue:** `cloudkb.indexing.compile` (durable, with dead-letter)
    servers:
      - $ref: "#/servers/rabbitmq-dev"
      - $ref: "#/servers/rabbitmq-prod"
    messages:
      compileTask:
        $ref: "#/components/messages/CompileKnowledgeTask"

  # ── RabbitMQ: Dead-Letter Queue ─────────────────────────
  knowledgeCompileDLQ:
    address: "cloudkb.indexing.compile.dlq"
    description: |
      Dead-letter queue for failed compilation tasks. Messages that exceed
      the retry limit (3 attempts with exponential backoff) are routed here
      for manual inspection and replay.
    servers:
      - $ref: "#/servers/rabbitmq-dev"
      - $ref: "#/servers/rabbitmq-prod"
    messages:
      deadLetteredTask:
        $ref: "#/components/messages/CompileKnowledgeTask"

  # ── Redis Pub/Sub: Tenant Notification Channel ─────────
  tenantNotificationChannel:
    address: "ch:notifications:{tenantId}"
    description: |
      Redis Pub/Sub channel scoped per tenant. The Index Worker publishes
      progress and completion events here. The Notification SSE Service
      subscribes and pushes events to the frontend via `text/event-stream`.

      **Channel Pattern:** `ch:notifications:*` (per-tenant isolation)
    parameters:
      tenantId:
        description: The tenant/user identifier (matches `X-User-Id` header)
    servers:
      - $ref: "#/servers/redis-dev"
      - $ref: "#/servers/redis-prod"
    messages:
      indexProgress:
        $ref: "#/components/messages/IndexProgressEvent"
      indexCompleted:
        $ref: "#/components/messages/IndexCompletedEvent"
      indexFailed:
        $ref: "#/components/messages/IndexFailedEvent"

  # ── Redis Key: Distributed Lock ────────────────────────
  indexLockChannel:
    address: "lock:index:{tenantId}"
    description: |
      Redis-based distributed lock key. Acquired by the Index Worker before
      starting BM25 computation to prevent concurrent index corruption for
      the same tenant. Uses `SET NX EX` with a 300-second TTL.
    parameters:
      tenantId:
        description: The tenant/user identifier
    servers:
      - $ref: "#/servers/redis-dev"
      - $ref: "#/servers/redis-prod"
    messages:
      lockAcquired:
        $ref: "#/components/messages/LockAcquired"

  # ── Redis Key: Cached KB Index ─────────────────────────
  kbIndexCache:
    address: "kb:index:{tenantId}"
    description: |
      Redis cache key storing the tenant's lightweight BM25 explicit index
      (JSON). Contains section metadata, DF/TF stats, and avgdl — but
      **not** raw section content. Read by the Chat Service for O(1) fast
      in-memory BM25 scoring.
    parameters:
      tenantId:
        description: The tenant/user identifier
    servers:
      - $ref: "#/servers/redis-dev"
      - $ref: "#/servers/redis-prod"
    messages:
      indexPayload:
        $ref: "#/components/messages/TenantKbIndexPayload"

# ─────────────────────────────────────────────────────────
# Operations
# ─────────────────────────────────────────────────────────
operations:

  publishCompileTask:
    action: send
    channel:
      $ref: "#/channels/knowledgeCompileQueue"
    summary: Indexing API publishes a compile task after S3 upload
    description: |
      Triggered by `POST /api/index`. After successfully streaming Markdown
      files to S3, the Indexing API serialises a `CompileKnowledgeTask`
      message and publishes it to the RabbitMQ exchange.

  consumeCompileTask:
    action: receive
    channel:
      $ref: "#/channels/knowledgeCompileQueue"
    summary: Index Worker consumes compile tasks from the queue
    description: |
      The `CloudKB.Worker.Indexer` BackgroundService polls the durable
      queue, acquires a per-tenant distributed lock, performs Markdown
      parsing / BM25 computation, and writes results to PostgreSQL & Redis.

  publishNotification:
    action: send
    channel:
      $ref: "#/channels/tenantNotificationChannel"
    summary: Index Worker publishes progress/completion events
    description: |
      During and after compilation, the worker publishes structured JSON
      events to the tenant's Redis Pub/Sub channel.

  subscribeNotification:
    action: receive
    channel:
      $ref: "#/channels/tenantNotificationChannel"
    summary: Notification Service subscribes to tenant events
    description: |
      `CloudKB.ApiService.Notification` subscribes to `ch:notifications:*`
      and relays events as SSE frames to the connected frontend client.

# ─────────────────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────────────────
components:

  messages:

    # ── RabbitMQ Messages ─────────────────────────────────
    CompileKnowledgeTask:
      name: CompileKnowledgeTask
      title: Knowledge Compilation Task
      summary: |
        Lightweight task envelope pushed to RabbitMQ after file upload.
        Contains only references (S3 paths), not file content.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/CompileKnowledgeTaskPayload"
      headers:
        $ref: "#/components/schemas/MessageHeaders"

    # ── Redis Pub/Sub Messages ────────────────────────────
    IndexProgressEvent:
      name: IndexProgressEvent
      title: Index Processing Progress
      summary: Published during Markdown parsing and BM25 computation
      contentType: application/json
      payload:
        $ref: "#/components/schemas/IndexProgressPayload"

    IndexCompletedEvent:
      name: IndexCompletedEvent
      title: Index Compilation Completed
      summary: Published when the entire compilation pipeline finishes
      contentType: application/json
      payload:
        $ref: "#/components/schemas/IndexCompletedPayload"

    IndexFailedEvent:
      name: IndexFailedEvent
      title: Index Compilation Failed
      summary: Published when compilation encounters an unrecoverable error
      contentType: application/json
      payload:
        $ref: "#/components/schemas/IndexFailedPayload"

    # ── Redis Data Messages ───────────────────────────────
    LockAcquired:
      name: LockAcquired
      title: Distributed Lock Acquired
      summary: Confirmation that the per-tenant index lock was obtained
      contentType: application/json
      payload:
        $ref: "#/components/schemas/LockAcquiredPayload"

    TenantKbIndexPayload:
      name: TenantKbIndexPayload
      title: Cached KB Index
      summary: |
        The lightweight tenant knowledge-base index cached in Redis.
        Contains BM25 statistics and section metadata without raw content.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/TenantKbIndex"

  # ── Schemas ─────────────────────────────────────────────
  schemas:

    MessageHeaders:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
          description: Unique message correlation ID
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of message creation
        retryCount:
          type: integer
          minimum: 0
          default: 0
          description: Current retry attempt (for DLQ routing)

    CompileKnowledgeTaskPayload:
      type: object
      required: [taskId, tenantId, s3StoragePath, fileNames]
      properties:
        taskId:
          type: string
          format: uuid
          description: Unique identifier for this compilation job
          examples: ["a1b2c3d4-e5f6-7890-abcd-ef1234567890"]
        tenantId:
          type: string
          description: Tenant isolation key (from X-User-Id)
          examples: ["tenant-01"]
        s3StoragePath:
          type: string
          description: |
            S3/MinIO base path where uploaded Markdown files are stored.
            Pattern: `/{tenantId}/raw/`
          examples: ["/tenant-01/raw/"]
        fileNames:
          type: array
          items:
            type: string
          description: List of Markdown filenames uploaded in this batch
          examples: [["refund_policy.md", "account_help.md", "shipping_faq.md"]]
        requestedAt:
          type: string
          format: date-time
          description: Timestamp when the upload request was received

    IndexProgressPayload:
      type: object
      required: [eventType, taskId, message]
      properties:
        eventType:
          type: string
          const: "IndexProcessing"
        taskId:
          type: string
          format: uuid
        message:
          type: string
          description: Human-readable progress description
          examples: ["正在切分 Markdown Section..."]
        progress:
          type: object
          properties:
            currentFile:
              type: string
              examples: ["refund_policy.md"]
            filesProcessed:
              type: integer
            totalFiles:
              type: integer
            sectionsFound:
              type: integer

    IndexCompletedPayload:
      type: object
      required: [eventType, taskId, message, metadata]
      properties:
        eventType:
          type: string
          const: "IndexCompleted"
        taskId:
          type: string
          format: uuid
        message:
          type: string
          examples: ["您的知識庫已編譯完成！"]
        metadata:
          type: object
          required: [sectionsCompiled, filesProcessed]
          properties:
            sectionsCompiled:
              type: integer
              description: Total number of sections indexed
              examples: [42]
            filesProcessed:
              type: integer
              description: Number of Markdown files processed
              examples: [5]
            averageDocumentLength:
              type: number
              format: double
              description: Computed avgdl for BM25 scoring
            compileDurationMs:
              type: integer
              description: Total compilation time in milliseconds

    IndexFailedPayload:
      type: object
      required: [eventType, taskId, message, errorCode]
      properties:
        eventType:
          type: string
          const: "IndexFailed"
        taskId:
          type: string
          format: uuid
        message:
          type: string
          examples: ["知識庫編譯失敗，請稍後重試。"]
        errorCode:
          type: string
          enum:
            - LOCK_TIMEOUT
            - S3_READ_FAILURE
            - PARSE_ERROR
            - DB_WRITE_FAILURE
          description: Machine-readable error classification
        errorDetail:
          type: string
          description: Detailed error message for debugging

    LockAcquiredPayload:
      type: object
      required: [tenantId, lockKey, ttlSeconds]
      properties:
        tenantId:
          type: string
        lockKey:
          type: string
          description: "Redis key: `lock:index:{tenantId}`"
          examples: ["lock:index:tenant-01"]
        ttlSeconds:
          type: integer
          description: Lock TTL in seconds
          default: 300
        acquiredAt:
          type: string
          format: date-time

    TenantKbIndex:
      type: object
      description: |
        Lightweight explicit index cached in Redis. Contains BM25
        statistical metadata and section navigation map — but NOT raw
        section content (that lives in PostgreSQL).
      required: [tenantId, totalDocuments, averageDocumentLength, sections]
      properties:
        tenantId:
          type: string
          examples: ["tenant-01"]
        totalDocuments:
          type: integer
          description: Total number of indexed sections (N in BM25 IDF)
        averageDocumentLength:
          type: number
          format: double
          description: Average token count across all sections (avgdl)
        lastUpdatedAt:
          type: string
          format: date-time
        sections:
          type: array
          items:
            $ref: "#/components/schemas/IndexedSectionMeta"

    IndexedSectionMeta:
      type: object
      required: [sectionId, fileName, heading, headingPath, tokenCount, termFrequencies]
      properties:
        sectionId:
          type: string
          description: "Composite key: `{tenantId}#{fileName}#{slugified-heading}`"
          examples: ["tenant-01#refund_policy.md#refund-timeline"]
        fileName:
          type: string
          examples: ["refund_policy.md"]
        heading:
          type: string
          examples: ["Refund Timeline"]
        headingPath:
          type: array
          items:
            type: string
          description: Breadcrumb path for heading boost scoring
          examples: [["Refund Policy", "Refund Timeline"]]
        tokenCount:
          type: integer
          description: Number of tokens in this section (dl)
        termFrequencies:
          type: object
          additionalProperties:
            type: integer
          description: |
            Map of term → frequency count within this section.
            Used for in-memory BM25 TF computation.
          examples: [{"refund": 5, "timeline": 3, "business": 2, "days": 4}]
